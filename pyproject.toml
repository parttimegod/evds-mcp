[project]
name = "evds-mcp"
version = "0.1.0"
description = "TCMB EVDS verisi icin MCP sunucusu"
readme = "README.md"
license = "MIT"
authors = [{ name = "Emirhan Miralay" }]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.7",
    "httpx>=0.28.1",
    "statsmodels>=0.14.6",
]

[project.scripts]
evds-mcp = "evds_mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = ["live: gercek EVDS API'sine baglanir, varsayilan olarak atlanir"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 90

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
